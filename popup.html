<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Meeting Transcripts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-shell">
    <main class="popup-page stack">
      <header class="topbar">
        <div class="brand">
          <h1>Meeting Transcripts</h1>
          <p id="backendStatus">Checking backend...</p>
        </div>
        <button class="secondary" id="openSettings">Settings</button>
      </header>

      <div id="popupMessage" hidden></div>

      <section class="panel stack">
        <button id="startRecording">Start recording</button>
        <div class="toolbar">
          <button class="secondary" id="openDashboard">Recordings</button>
          <button class="secondary" id="refreshPopup">Refresh</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>Recent recordings</h2>
        </div>
        <div id="recentRecordings" class="recording-list"></div>
      </section>
    </main>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
