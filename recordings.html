<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recordings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Recordings</h1>
        <p id="dashboardStatus">Backend dashboard</p>
      </div>
      <div class="toolbar">
        <button id="openRecorder">Record</button>
        <button class="secondary" id="openSettings">Settings</button>
      </div>
    </header>

    <main class="page stack">
      <div id="dashboardMessage" hidden></div>

      <div class="dashboard-grid">
        <aside class="stack">
          <section class="panel stack">
            <div class="section-title">
              <h2>Recordings</h2>
              <button class="secondary" id="refreshRecordings">Refresh</button>
            </div>

            <label>
              Search
              <input id="searchInput" placeholder="Search title or transcript" />
            </label>
            <div class="toolbar">
              <select id="searchMode" aria-label="Search mode">
                <option value="hybrid">Hybrid</option>
                <option value="keyword">Keyword</option>
                <option value="semantic">Semantic</option>
              </select>
              <button id="runSearch">Search</button>
              <button class="secondary" id="clearSearch">Clear</button>
            </div>

            <div id="recordingList" class="recording-list"></div>
          </section>

          <section class="panel stack">
            <div class="section-title">
              <h2>Import Google Meet</h2>
            </div>
            <label>
              Meet link or code
              <input id="meetLinkOrCode" placeholder="https://meet.google.com/..." />
            </label>
            <label>
              Google access token
              <textarea id="googleAccessToken" spellcheck="false"></textarea>
            </label>
            <label>
              Title
              <input id="meetTitle" placeholder="Optional title" />
            </label>
            <label>
              Description
              <textarea id="meetDescription" placeholder="Optional description"></textarea>
            </label>
            <button id="importMeet">Import transcript</button>
          </section>
        </aside>

        <section class="detail-layout">
          <section class="panel" id="emptyDetail">
            <div class="empty-state">Select a recording.</div>
          </section>

          <section class="panel stack" id="detailContent" hidden>
            <div class="section-title">
              <h2 id="detailTitle">Recording</h2>
              <span id="detailStatus" class="status-pill"></span>
            </div>

            <div class="metric-row">
              <div class="metric">
                <span class="muted small">Duration</span>
                <strong id="detailDuration">0:00</strong>
              </div>
              <div class="metric">
                <span class="muted small">Size</span>
                <strong id="detailSize">0 B</strong>
              </div>
              <div class="metric">
                <span class="muted small">Created</span>
                <strong id="detailCreated">Not available</strong>
              </div>
              <div class="metric">
                <span class="muted small">Type</span>
                <strong id="detailType">meeting</strong>
              </div>
            </div>

            <form id="metadataForm" class="stack">
              <div class="grid grid-2">
                <label>
                  Title
                  <input id="metadataTitle" required />
                </label>
                <label>
                  Type
                  <select id="metadataType">
                    <option value="meeting">Meeting</option>
                    <option value="lecture">Lecture</option>
                    <option value="interview">Interview</option>
                    <option value="voice_note">Voice note</option>
                    <option value="call">Call</option>
                  </select>
                </label>
              </div>
              <label>
                Description
                <textarea id="metadataDescription"></textarea>
              </label>
              <div class="toolbar">
                <button type="submit">Save metadata</button>
                <button class="secondary" type="button" id="reloadDetail">Reload</button>
                <button class="danger" type="button" id="deleteRecording">Delete</button>
              </div>
            </form>
          </section>

          <section class="panel stack" id="aiPanel" hidden>
            <div class="section-title">
              <h2>Transcript and AI</h2>
            </div>
            <div>
              <h3>Short summary</h3>
              <div id="shortSummary" class="text-block"></div>
            </div>
            <div>
              <h3>Transcript</h3>
              <div id="transcriptText" class="text-block"></div>
            </div>
            <div class="grid grid-2">
              <div>
                <h3>Key points</h3>
                <div id="keyPoints" class="text-block"></div>
              </div>
              <div>
                <h3>Decisions</h3>
                <div id="decisions" class="text-block"></div>
              </div>
            </div>
            <div>
              <h3>Action items</h3>
              <div id="actionItems" class="text-block"></div>
            </div>
          </section>

          <section class="panel stack" id="chatPanel" hidden>
            <div class="section-title">
              <h2>Chat</h2>
              <button class="secondary" id="newChat">New chat</button>
            </div>
            <div id="chatMessage" hidden></div>
            <label>
              Session
              <select id="chatSelect"></select>
            </label>
            <div id="chatLog" class="chat-log"></div>
            <label>
              Message
              <textarea id="chatInput" placeholder="Ask about this recording"></textarea>
            </label>
            <button id="sendChat">Send</button>
          </section>
        </section>
      </div>
    </main>

    <script type="module" src="dist/recordings.js"></script>
  </body>
</html>
